[workspace]
members = [".", "contracts", "native", "helper", "ffi", "client", "tools/artifact", "qualification"]
resolver = "3"
exclude = ["vendor/skvoz-core/contracts", "vendor/skvoz-core/binding", "vendor/skvoz-core/tls", "vendor/async-nats"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
async-nats = { path = "vendor/async-nats" }

[package]
name = "skvoz-network"
version = "0.7.0"
description = "Shared bounded network adapter for the universal SKVOZ Core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
enrollment-diagnostics = []
portable-runtime = ["dep:skvoz-network-native"]
linux-runtime = ["portable-runtime"]

[[bin]]
name = "skvoz-network-runtime"
path = "src/bin/skvoz-network-runtime.rs"
required-features = ["linux-runtime"]

[dependencies]
skvoz-core = { package = "skvoz-core-binding", path = "vendor/skvoz-core/binding" }
skvoz-network-contracts = { path = "contracts" }
skvoz-core-tls = { path = "vendor/skvoz-core/tls" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
async-nats = { version = "=0.50.0", default-features = false, features = ["ring"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
getrandom = "=0.4.3"
tokio = { version = "=1.53.1", features = ["rt", "macros", "time", "net", "sync", "io-util"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
skvoz-network-native = { path = "native", optional = true }

[lints]
workspace = true

[profile.release]
opt-level = 3
codegen-units = 16
lto = false
panic = "unwind"

[build-dependencies]
serde_json = "=1.0.151"
