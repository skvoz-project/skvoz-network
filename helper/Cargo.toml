[package]
name = "skvoz-network-helper"
version = "0.6.0"
description = "Scoped Linux network setup for the shared SKVOZ runtime"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
skvoz-network = { package = "skvoz-network-contracts", path = "../contracts" }
skvoz-network-native = { path = "../native" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
getrandom = "=0.4.3"

[lints]
workspace = true

[[test]]
name = "kernel_client"
harness = false

[dev-dependencies]
socket2 = { version = "=0.6.5", features = ["all"] }

[[test]]
name = "ip_topology"
harness = false
