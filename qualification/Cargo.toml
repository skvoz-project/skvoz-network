[package]
name = "skvoz-network-qualification"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
real-nats = []

[dependencies]
skvoz-core = { package = "skvoz-core-binding", path = "../vendor/skvoz-core/binding" }
skvoz-network = { path = "..", features = ["portable-runtime"] }
skvoz-network-native = { path = "../native" }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[lints]
workspace = true
