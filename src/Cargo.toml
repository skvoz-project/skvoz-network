[workspace]
members = ["network", "contracts", "native", "helper", "ffi", "client", "tools", "qualification"]
resolver = "3"
exclude = ["vendor/skvoz-core/contracts", "vendor/skvoz-core/binding", "vendor/skvoz-core/tls", "vendor/async-nats"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
async-nats = { path = "vendor/async-nats" }


[profile.release]
opt-level = 3
codegen-units = 16
lto = false
panic = "unwind"

