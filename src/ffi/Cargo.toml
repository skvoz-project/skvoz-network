[package]
name = "skvoz-network-ffi"
version = "0.7.0"
description = "Native ABI for the shared SKVOZ network actor"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
skvoz-network = { path = "../network", features = ["linux-runtime"] }
skvoz-network-native = { path = "../native" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
libc = "=0.2.183"
serde_json = "=1.0.151"
skvoz-network-qualification = { path = "../qualification" }
