[package]
name = "skvoz-network-qualification"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
experiments = ["dep:skvoz-core", "dep:skvoz-network", "dep:skvoz-network-native", "dep:tokio"]

[dependencies]
skvoz-network-contracts = { path = "../contracts" }
skvoz-core = { package = "skvoz-core-binding", path = "../vendor/skvoz-core/binding", optional = true }
skvoz-network = { path = "../network", features = ["portable-runtime"], optional = true }
skvoz-network-native = { path = "../native", optional = true }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"], optional = true }

[lints]
workspace = true

[[bin]]
name = "network_probe"
path = "src/bin/network_probe.rs"
required-features = ["experiments"]
test = false
